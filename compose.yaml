services:
  php:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.5}
    image: ux-datetime:php${PHP_VERSION:-8.5}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /app
    volumes:
      - .:/app

  bun:
    image: oven/bun:1
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /app/assets
    environment:
      HOME: /tmp
    volumes:
      - .:/app
